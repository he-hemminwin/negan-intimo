<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Negan — Escena privada · Ollama local</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <strong>NEGAN</strong>
      <span>escena privada · IA local</span>
    </div>
    <button id="settingsBtn" class="ghost">⚙︎</button>
  </header>

  <main>
    <section id="chat" aria-live="polite"></section>
  </main>

  <footer>
    <textarea id="input" rows="3" placeholder="Escribe como Oddi…"></textarea>
    <div class="actions">
      <button id="continueBtn" class="secondary">Continuar desde aquí</button>
      <button id="sendBtn">Enviar</button>
      <button id="exportBtn" class="secondary">Cerrar y exportar</button>
    </div>
    <div id="status"></div>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>Ajustes</h2>
      <label>URL de Ollama
        <input id="ollamaUrl" type="url" value="http://127.0.0.1:11434" />
      </label>
      <label>Modelo
        <input id="model" value="negan-rp" />
      </label>
      <label>Temperatura
        <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.85" />
      </label>
      <label>Contexto máximo
        <input id="numCtx" type="number" min="4096" max="16384" step="1024" value="8192" />
      </label>
      <label>Estado físico actual de la escena
        <textarea id="sceneState" rows="11" placeholder="Lugar, postura de Negan, postura de Oddi, quién está encima/debajo, orientación, ropa, manos, distancia, último movimiento..."></textarea>
      </label>
      <p class="hint">Esta versión usa Ollama en tu propio PC. No necesita Groq ni Cloudflare Worker. El razonamiento interno se solicita desactivado y la app solo muestra la respuesta final.</p>
      <div class="dialogActions">
        <button value="cancel" class="secondary">Cancelar</button>
        <button id="saveSettings" value="default">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="context.js"></script>
  <script src="app.js"></script>
</body>
</html>
